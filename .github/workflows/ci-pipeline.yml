name: Java CI com Maven, Selenium e Allure Report (Com Display Gráfico)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    services:
      selenium-hub:
        image: selenium/hub:4.39.0
        ports:
          - 4444:4444
          - 4442:4442
          - 4443:4443

      chrome:
        image: selenium/node-chrome:4.39.0
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: "1"
          SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

    env:
      SELENIUM_HUB_URL: "http://selenium-hub:4444"

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2️⃣ Instalação do Maven
      - name: 🛠️ Instalar Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      # 3️⃣ Configuração do JDK 22
      - name: ☕ Configurar JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      # 4️⃣ Esperar Selenium Grid
      - name: ⏳ Aguardar Selenium Grid
        run: |
          echo "Aguardando Selenium Grid ficar pronto..."
          for i in {1..40}; do
            STATUS=$(curl -s http://selenium-hub:4444/status || true)
            echo "$STATUS"
            if echo "$STATUS" | grep -q '"ready":true'; then
              echo "Selenium Grid pronto!"
              exit 0
            fi
            sleep 2
          done
          echo "Selenium Grid não ficou pronto a tempo"
          exit 1

      # 5️⃣ Compilar, executar testes e gerar Allure Results
      - name: Compilar, Executar Testes e Gerar Allure Results
        run: mvn clean test  -DrunMode="remote" allure:report -Pci

      # 6️⃣ Organizar relatórios
      - name: 📂 Organizar relatórios
        run: |
          mkdir -p reports/allure-reports
          mkdir -p reports/allure-results
          mkdir -p reports/cucumber-reports

          if [ -d "target/allure-reports" ]; then
            cp -r target/allure-reports/* reports/allure-reports/
          else
            echo "Nenhum relatório Allure encontrado"
          fi

          if [ -d "target/allure-results" ]; then
            cp -r target/allure-results/* reports/allure-results/
          else
            echo "Nenhum resultado Allure encontrado"
          fi

          if [ -d "target/cucumber-reports" ]; then
            cp -r target/cucumber-reports/* reports/cucumber-reports/
          else
            echo "Nenhum relatório Cucumber encontrado"
          fi

          if ls target/docs/*.pdf 1> /dev/null 2>&1; then
            cp target/docs/*.pdf reports/
          else
            echo "Nenhum PDF encontrado"
          fi

      # 7️⃣ Publicar Allure Report no GitHub Pages
      - name: 🌐 Publicar Allure Report no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/allure-reports
          publish_branch: gh-pages
          user_name: "github-actions"
          user_email: "github-actions@github.com"

      # 8️⃣ Upload de todos os relatórios como artefatos
      - name: 📤 Publicar relatórios como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
